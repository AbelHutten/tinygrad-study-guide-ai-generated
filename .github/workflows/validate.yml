name: Validate guide

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-labs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check out the recorded tinygrad snapshot
        run: |
          git clone --filter=blob:none https://github.com/tinygrad/tinygrad.git "${{ runner.temp }}/tinygrad-study"
          git -C "${{ runner.temp }}/tinygrad-study" switch --detach 874d33128b4e4785beea736d97df6716e0321717
      - name: Validate source links and symbols
        run: python scripts/check_docs.py --tinygrad "${{ runner.temp }}/tinygrad-study"
      - name: Run portable and CPU labs
        run: python scripts/run_labs.py --tinygrad "${{ runner.temp }}/tinygrad-study" --device CPU
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-and-labs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
